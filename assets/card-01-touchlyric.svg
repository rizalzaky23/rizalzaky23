<svg width="390" height="155" viewBox="0 0 390 155" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1320" />
      <stop offset="100%" stop-color="#111726" />
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .repo-card {
      transition: transform 0.25s ease, filter 0.25s ease;
    }
    .repo-card:hover {
      filter: drop-shadow(0 0 10px #8a2be288);
    }
  </style>

  <g class="repo-card">
    <rect x="3" y="3" width="384" height="149" rx="16" fill="url(#cardBg)" stroke="url(#cardBorderGrad)" stroke-width="1.8" />

    <g transform="translate(24, 25)">
      <!-- Badge -->
      <text x="0" y="0" fill="#00f2fe" font-size="10" font-weight="700" letter-spacing="1.6">CARD 01</text>

      <!-- Title -->
      <text x="0" y="26" fill="#ffffff" font-size="17.5" font-weight="800" letter-spacing="0.2">TouchLyric</text>

      <!-- Description -->
      <text x="0" y="50" fill="#8b949e" font-size="12.5" font-weight="400">A project in progress.</text>
      

      <!-- Footer stats -->
      <g transform="translate(0, 92)">
        <!-- Star -->
        <text x="0" y="11" fill="#8b949e" font-size="12" font-weight="500">★  <tspan fill="#c9d1d9">1</tspan></text>

        <!-- Fork -->
        <text x="38" y="11" fill="#8b949e" font-size="12" font-weight="500">⑂  <tspan fill="#c9d1d9">0</tspan></text>

        <!-- Language Icon & Name -->
        <rect x="82" y="1" width="13" height="13" rx="3" fill="#f05138" />
        <text x="102" y="11" fill="#c9d1d9" font-size="12.5" font-weight="600">Swift</text>
      </g>
    </g>
  </g>
</svg>