<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="powersBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d121e" />
      <stop offset="100%" stop-color="#111726" />
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    @keyframes glowSubtle {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.3)); }
      50% { filter: drop-shadow(0 0 14px rgba(138, 43, 226, 0.4)); }
    }
    .powers-border {
      animation: glowSubtle 5s ease-in-out infinite;
    }
  </style>

  <rect class="powers-border" x="5" y="5" width="790" height="230" rx="16" fill="url(#cardBg)" stroke="url(#powersBorderGrad)" stroke-width="2" />

  <!-- Title -->
  <text x="35" y="32" fill="#8b949e" font-size="10.5" font-weight="700" letter-spacing="2">POWERS</text>

  <!-- Progress Rows -->
  
    <!-- Dart -->
    <g>
      <circle cx="42" cy="58" r="8" fill="#02569B" />
        <path d="M38 54L44 56L46 62L40 60Z" fill="#00f2fe" />
      <text x="60" y="62" fill="#e6edf3" font-size="13" font-weight="600">Dart</text>
      <!-- Background track -->
      <rect x="210" y="53" width="510" height="10" rx="5" fill="#161e2e" />
      <!-- Progress Bar -->
      <rect class="prog-bar" x="210" y="53" width="178" height="10" rx="5" fill="#00f2fe" />
      <!-- Percentage -->
      <text x="760" y="62" text-anchor="end" fill="#8b949e" font-size="12" font-weight="600" font-family="ui-monospace, monospace">35%</text>
    </g>
    <!-- JavaScript -->
    <g>
      <rect x="34" y="85" width="16" height="16" rx="3" fill="#f7df1e" />
        <text x="42" y="96" text-anchor="middle" fill="#000" font-size="8.5" font-weight="900" font-family="monospace">JS</text>
      <text x="60" y="97" fill="#e6edf3" font-size="13" font-weight="600">JavaScript</text>
      <!-- Background track -->
      <rect x="210" y="88" width="510" height="10" rx="5" fill="#161e2e" />
      <!-- Progress Bar -->
      <rect class="prog-bar" x="210" y="88" width="107" height="10" rx="5" fill="#f7df1e" />
      <!-- Percentage -->
      <text x="760" y="97" text-anchor="end" fill="#8b949e" font-size="12" font-weight="600" font-family="ui-monospace, monospace">21%</text>
    </g>
    <!-- PHP -->
    <g>
      <rect x="34" y="122" width="16" height="13" rx="3" fill="#777bb4" />
        <text x="42" y="132" text-anchor="middle" fill="#fff" font-size="6.5" font-weight="900" font-family="monospace">PHP</text>
      <text x="60" y="132" fill="#e6edf3" font-size="13" font-weight="600">PHP</text>
      <!-- Background track -->
      <rect x="210" y="123" width="510" height="10" rx="5" fill="#161e2e" />
      <!-- Progress Bar -->
      <rect class="prog-bar" x="210" y="123" width="66" height="10" rx="5" fill="#777bb4" />
      <!-- Percentage -->
      <text x="760" y="132" text-anchor="end" fill="#8b949e" font-size="12" font-weight="600" font-family="ui-monospace, monospace">13%</text>
    </g>
    <!-- TypeScript -->
    <g>
      <rect x="34" y="155" width="16" height="16" rx="3" fill="#3178c6" />
        <text x="42" y="166" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="900" font-family="monospace">TS</text>
      <text x="60" y="167" fill="#e6edf3" font-size="13" font-weight="600">TypeScript</text>
      <!-- Background track -->
      <rect x="210" y="158" width="510" height="10" rx="5" fill="#161e2e" />
      <!-- Progress Bar -->
      <rect class="prog-bar" x="210" y="158" width="61" height="10" rx="5" fill="#3178c6" />
      <!-- Percentage -->
      <text x="760" y="167" text-anchor="end" fill="#8b949e" font-size="12" font-weight="600" font-family="ui-monospace, monospace">12%</text>
    </g>
    <!-- HTML -->
    <g>
      <rect x="34" y="190" width="16" height="16" rx="3" fill="#e34f26" />
        <text x="42" y="201" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="900" font-family="monospace">5</text>
      <text x="60" y="202" fill="#e6edf3" font-size="13" font-weight="600">HTML</text>
      <!-- Background track -->
      <rect x="210" y="193" width="510" height="10" rx="5" fill="#161e2e" />
      <!-- Progress Bar -->
      <rect class="prog-bar" x="210" y="193" width="35" height="10" rx="5" fill="#e34f26" />
      <!-- Percentage -->
      <text x="760" y="202" text-anchor="end" fill="#8b949e" font-size="12" font-weight="600" font-family="ui-monospace, monospace">7%</text>
    </g>
</svg>