<svg width="800" height="245" viewBox="0 0 800 245" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0e1320" />
    </linearGradient>

    <linearGradient id="statBoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" />
      <stop offset="100%" stop-color="#0d121e" />
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .stat-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Outer Card -->
  <rect x="5" y="5" width="790" height="170" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(35, 38)">
    <text x="0" y="0" fill="#ffffff" font-size="22" font-weight="900" letter-spacing="-0.3">Profile Signal</text>
    <text x="0" y="22" fill="#8b949e" font-size="13" font-weight="500">Live GitHub stats styled by GitSkins</text>
  </g>

  <!-- 4 Stat Boxes (1x4 row) -->
  <!-- Box 1: Stars -->
  <g transform="translate(35, 78)">
    <rect width="170" height="80" rx="12" fill="url(#statBoxBg)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="16" y="24" fill="#8b949e" font-size="11" font-weight="700">Stars</text>
    <text x="16" y="54" class="stat-val" fill="#388bfd" font-size="26" font-weight="800">1</text>
    <rect x="16" y="64" width="36" height="3.5" rx="2" fill="#388bfd" />
  </g>

  <!-- Box 2: Contributions -->
  <g transform="translate(220, 78)">
    <rect width="170" height="80" rx="12" fill="url(#statBoxBg)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="16" y="24" fill="#8b949e" font-size="11" font-weight="700">Contributions</text>
    <text x="16" y="54" class="stat-val" fill="#00f2fe" font-size="26" font-weight="800">434</text>
    <rect x="16" y="64" width="120" height="3.5" rx="2" fill="#00f2fe" />
  </g>

  <!-- Box 3: Repos -->
  <g transform="translate(405, 78)">
    <rect width="170" height="80" rx="12" fill="url(#statBoxBg)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="16" y="24" fill="#8b949e" font-size="11" font-weight="700">Repos</text>
    <text x="16" y="54" class="stat-val" fill="#bc8cff" font-size="26" font-weight="800">17</text>
    <rect x="16" y="64" width="36" height="3.5" rx="2" fill="#bc8cff" />
  </g>

  <!-- Box 4: Followers -->
  <g transform="translate(590, 78)">
    <rect width="170" height="80" rx="12" fill="url(#statBoxBg)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="16" y="24" fill="#8b949e" font-size="11" font-weight="700">Followers</text>
    <text x="16" y="54" class="stat-val" fill="#3fb950" font-size="26" font-weight="800">12</text>
    <rect x="16" y="64" width="36" height="3.5" rx="2" fill="#3fb950" />
  </g>

  <!-- Watermark -->
  <text x="780" y="166" text-anchor="end" fill="#6e7681" font-size="9.5" font-weight="500">gitskins.com</text>

  <!-- Bottom Pill Badge: GitHub @rizalzaky23 -->
  <g transform="translate(325, 195)">
    <rect width="150" height="38" rx="19" fill="#111726" stroke="url(#pillBorder)" stroke-width="1.5" />
    <!-- GitHub 'G' icon badge -->
    <circle cx="24" cy="19" r="10" fill="#ffffff" />
    <text x="24" y="23" text-anchor="middle" fill="#000000" font-size="11" font-weight="900">G</text>
    <text x="42" y="15" fill="#8b949e" font-size="9" font-weight="600">GitHub</text>
    <text x="42" y="27" fill="#ffffff" font-size="11.5" font-weight="800">@rizalzaky23</text>
  </g>
</svg>